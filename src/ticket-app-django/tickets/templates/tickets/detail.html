<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket #{{ ticket.id }} – TaskDesk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; color: #1a1a2e; padding: 1.5rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06); max-width: 600px; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; padding-bottom: .75rem; border-bottom: 1px solid #f0f0f0; color: #1a1a2e; }
    .field { margin-bottom: 1rem; }
    .field-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #777; margin-bottom: .3rem; }
    .field-value { font-size: .95rem; color: #1a1a2e; }
    .badge { display: inline-block; padding: .2rem .65rem; border-radius: 20px; font-size: .78rem; font-weight: 600; text-transform: capitalize; }
    .badge-open   { background: #fff3e0; color: #e65100; }
    .badge-closed { background: #e8f5e9; color: #2e7d32; }
    .sev { display: inline-block; padding: .2rem .65rem; border-radius: 20px; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
    .sev-critical { background: #fde8e8; color: #b71c1c; }
    .sev-high     { background: #fff3e0; color: #bf360c; }
    .sev-medium   { background: #fff8e1; color: #f57f17; }
    .sev-low      { background: #e8f5e9; color: #2e7d32; }
    .btn-close { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; padding: .4rem 1.1rem; border-radius: 6px; font-size: .875rem; font-weight: 600; cursor: pointer; margin-top: 1.25rem; transition: background .15s; }
    .btn-close:hover:not(:disabled) { background: #c8e6c9; }
    .btn-close:disabled { background: #f5f5f5; color: #bbb; border-color: #e0e0e0; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Ticket #{{ ticket.id }}</h2>

    <div class="field">
      <div class="field-label">Title</div>
      <div class="field-value" id="detail-title">{{ ticket.title }}</div>
    </div>

    <div class="field">
      <div class="field-label">Description</div>
      <div class="field-value" id="detail-description">{{ ticket.description }}</div>
    </div>

    <div class="field">
      <div class="field-label">Severity</div>
      <div class="field-value">
        <span class="sev sev-{{ ticket.severity }}" id="detail-severity">{{ ticket.severity }}</span>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Status</div>
      <div class="field-value">
        <span class="badge badge-{{ ticket.status }}" id="detail-status">{{ ticket.status }}</span>
      </div>
    </div>

    {% if request.user.is_staff %}
      <form method="post" action="{% url 'close_ticket' ticket.id %}">
        {% csrf_token %}
        <button type="submit" class="btn-close" id="close-detail-button"
                {% if ticket.status == "closed" %}disabled{% endif %}>
          {% if ticket.status == "closed" %}Closed{% else %}Close Ticket{% endif %}
        </button>
      </form>
    {% else %}
      <button class="btn-close" id="close-detail-button" disabled>Close Ticket</button>
    {% endif %}
  </div>
</body>
</html>
